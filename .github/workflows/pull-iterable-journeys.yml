name: Pull Iterable journey data (test)

on:
  workflow_dispatch:
    inputs:
      journey_ids:
        description: 'Comma-separated Iterable journey IDs to pull'
        required: true
        default: '226142,277059,277060,277719,277720,283031,283032,283501,283503,285081,348886,348888,348889,361552,380903,395123,397134,420239,432250,432249,432248,432247,432241,432245,454374,491753,492899,492898,492896,498496,591526,574376,573754,573751,573762,574394,573711,574392,574378,573710,574380,658960,658958,576402,592260,639865,687714,687711,687710,687709,769755,890935,81281,286934,287009,287065,287070,287075,287084,287085,287097,361050,976148,976178'

jobs:
  pull-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and shape Iterable data
        env:
          ITERABLE_API_KEY: ${{ secrets.ITERABLE_SANDBOX_API_KEY }}
          JOURNEY_IDS: ${{ github.event.inputs.journey_ids }}
        run: node scripts/pull-iterable-journeys.js

      - name: Show output for review
        run: cat data/iterable-journeys.json

      - name: Commit updated data file
        run: |
          git config user.name "iterable-sync-bot"
          git config user.email "actions@github.com"
          git add data/iterable-journeys.json
          git diff --staged --quiet || git commit -m "Update Iterable journey data (manual run)"
          git push
