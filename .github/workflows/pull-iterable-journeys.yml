name: Pull Iterable journey data

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which Iterable environment to pull from'
        required: true
        type: choice
        default: 'sandbox'
        options:
          - sandbox
          - ria_digital_prod
      journey_ids:
        description: 'Comma-separated Iterable journey IDs to pull. Leave blank to pull EVERYTHING (all journeys + standalone campaigns, if included below) for the selected environment. IDs are account-specific — do not reuse Sandbox IDs for a Prod run, or vice versa.'
        required: false
      include_standalone_campaigns:
        description: 'Also fetch template content for campaigns not tied to any journey (one-off Blast sends etc). Slower — this is the biggest chunk of a full pull. Off by default since the Hub does not need these right now.'
        required: false
        type: boolean
        default: false
      category_filter:
        description: 'On a full pull, only keep journeys under these categories (comma-separated, matches the Hub''s own category grouping). Leave as-is for Transactional + Transaction status only. Clear this field (blank) to keep every category.'
        required: false
        default: 'Transactional,Transaction status'
      enabled_only:
        description: 'On a full pull, only keep enabled journeys (skip disabled ones).'
        required: false
        type: boolean
        default: true

jobs:
  pull-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Select environment config
        id: env
        run: |
          if [ "${{ github.event.inputs.environment }}" = "ria_digital_prod" ]; then
            echo "output_file=data/iterable-journeys-ria-prod.json" >> "$GITHUB_OUTPUT"
            echo "source_label=iterable-ria-digital-prod" >> "$GITHUB_OUTPUT"
          else
            echo "output_file=data/iterable-journeys.json" >> "$GITHUB_OUTPUT"
            echo "source_label=iterable-sandbox" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch and shape Iterable data
        env:
          ITERABLE_API_KEY: ${{ github.event.inputs.environment == 'ria_digital_prod' && secrets.ITERABLE_RIA_PROD_API_KEY || secrets.ITERABLE_SANDBOX_API_KEY }}
          JOURNEY_IDS: ${{ github.event.inputs.journey_ids }}
          INCLUDE_STANDALONE: ${{ github.event.inputs.include_standalone_campaigns }}
          CATEGORY_FILTER: ${{ github.event.inputs.category_filter }}
          ENABLED_ONLY: ${{ github.event.inputs.enabled_only }}
          OUTPUT_FILE: ${{ steps.env.outputs.output_file }}
          SOURCE_LABEL: ${{ steps.env.outputs.source_label }}
        run: node scripts/pull-iterable-journeys.js

      - name: Show output for review
        run: cat "${{ steps.env.outputs.output_file }}"

      - name: Commit updated data file
        run: |
          git config user.name "iterable-sync-bot"
          git config user.email "actions@github.com"
          git add "${{ steps.env.outputs.output_file }}"
          git diff --staged --quiet || git commit -m "Update Iterable journey data (${{ github.event.inputs.environment }}, manual run)"
          git push
