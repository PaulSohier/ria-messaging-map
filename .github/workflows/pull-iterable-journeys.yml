name: Pull Iterable journey data

on:
  # Automatic, two schedules:
  # - Ria Digital Prod: same default settings as the manual run (enabled
  #   journeys, Transactional + Transaction status categories, no standalone
  #   campaigns).
  # - Xe Digital Prod: a fixed, hand-picked list of journey IDs (Paul chose
  #   these directly in Iterable, Sep 2026 — Xe's campaigns don't use a
  #   Transactional label/category the way Ria's do, so a category filter
  #   would not work for Xe). See XE_JOURNEY_IDS in the "Select environment
  #   config" step below for the actual list.
  # Sandbox stays manual-only — trigger it by hand via workflow_dispatch
  # when testing.
  # Cron is UTC. 4:00 and 5:00 UTC picked as quiet, off-hours defaults, one
  # hour apart so the two runs don't overlap; change the lines below if a
  # different time suits better, nothing else depends on it.
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which Iterable environment to pull from'
        required: true
        type: choice
        default: 'sandbox'
        options:
          - sandbox
          - ria_digital_prod
          - xe_digital_prod
      journey_ids:
        description: 'Comma-separated Iterable journey IDs to pull. Leave blank to pull EVERYTHING (all journeys + standalone campaigns, if included below) for the selected environment — except Xe Digital Prod, where blank instead means "use the fixed Xe journey list" (see XE_JOURNEY_IDS in the workflow file). IDs are account-specific — do not reuse one environment''s IDs for another.'
        required: false
      include_standalone_campaigns:
        description: 'Also fetch template content for campaigns not tied to any journey (one-off Blast sends etc). Slower — this is the biggest chunk of a full pull. Off by default since the Hub does not need these right now.'
        required: false
        type: boolean
        default: false
      category_filter:
        description: 'On a full pull, only keep journeys under these categories (comma-separated, matches the Hub''s own category grouping). Leave as-is for Transactional + Transaction status only. Clear this field (blank) to keep every category.'
        required: false
        default: 'Transactional,Transaction status'
      enabled_only:
        description: 'On a full pull, only keep enabled journeys (skip disabled ones).'
        required: false
        type: boolean
        default: true

jobs:
  pull-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Select environment config
        id: env
        run: |
          # Fixed, hand-picked Xe journey list (Paul, Sep 2026 — chosen
          # directly in Iterable's own journey/folder view, enabled/live
          # journeys only). Xe's campaigns don't use a Transactional
          # label/category the way Ria's do, so this environment is always
          # pulled by explicit ID list, never by category filter. Update
          # this line by hand if Paul's list changes.
          XE_JOURNEY_IDS="300450,363179,395339,101943,462373,102004,204170,542415,102003,101965,173294,173285,173292,173289,426955,474938,312958,206237,206225,204815,101966,936126,613188,101949,101978,101947,375183,206229,318571,538831,523467,398882,398883,749959,749941"

          # A scheduled run has no "inputs" at all (github.event.inputs.* is
          # blank), unlike a manual workflow_dispatch run — so the effective
          # environment can't just read the dropdown directly here. There
          # are two schedules now (see the "on:" block above); the exact
          # cron string that fired tells us which one this is.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 5 * * *" ]; then
              ENVIRONMENT="xe_digital_prod"
            else
              ENVIRONMENT="ria_digital_prod"
            fi
          else
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          fi
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"

          if [ "$ENVIRONMENT" = "ria_digital_prod" ]; then
            echo "output_file=data/iterable-journeys-ria-prod.json" >> "$GITHUB_OUTPUT"
            echo "source_label=iterable-ria-digital-prod" >> "$GITHUB_OUTPUT"
          elif [ "$ENVIRONMENT" = "xe_digital_prod" ]; then
            echo "output_file=data/iterable-journeys-xe-prod.json" >> "$GITHUB_OUTPUT"
            echo "source_label=iterable-xe-digital-prod" >> "$GITHUB_OUTPUT"
          else
            echo "output_file=data/iterable-journeys.json" >> "$GITHUB_OUTPUT"
            echo "source_label=iterable-sandbox" >> "$GITHUB_OUTPUT"
          fi

          # Journey IDs: Xe always uses the fixed list above, whether this is
          # the scheduled Xe run or a manual Xe run where the field was left
          # blank. Typing specific IDs into the manual journey_ids field
          # still overrides it, in case only a subset is ever needed.
          # Every other environment behaves as before: use whatever was
          # typed into the manual field (blank means a full, category-scoped
          # pull for Ria; blank on Sandbox means a full, unfiltered pull).
          if [ "$ENVIRONMENT" = "xe_digital_prod" ] && { [ "${{ github.event_name }}" = "schedule" ] || [ -z "${{ github.event.inputs.journey_ids }}" ]; }; then
            echo "journey_ids=$XE_JOURNEY_IDS" >> "$GITHUB_OUTPUT"
          else
            echo "journey_ids=${{ github.event.inputs.journey_ids }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch and shape Iterable data
        env:
          # Uses steps.env.outputs.environment (already resolved above for
          # both trigger types), not github.event.inputs.environment
          # directly, which would be blank on a scheduled run.
          ITERABLE_API_KEY: ${{ steps.env.outputs.environment == 'ria_digital_prod' && secrets.ITERABLE_RIA_PROD_API_KEY || (steps.env.outputs.environment == 'xe_digital_prod' && secrets.ITERABLE_XE_PROD_API_KEY || secrets.ITERABLE_SANDBOX_API_KEY) }}
          JOURNEY_IDS: ${{ steps.env.outputs.journey_ids }}
          INCLUDE_STANDALONE: ${{ github.event.inputs.include_standalone_campaigns }}
          # A scheduled run has no inputs to fall back on (blank isn't "no
          # filter" here, it just means "not a manual run") so these two are
          # pinned explicitly to the standard defaults on schedule, same as
          # what the manual dropdown defaults to anyway. Not relevant for Xe
          # (Xe always pulls by explicit JOURNEY_IDS, which bypasses both),
          # but harmless to set regardless.
          CATEGORY_FILTER: ${{ github.event_name == 'schedule' && 'Transactional,Transaction status' || github.event.inputs.category_filter }}
          ENABLED_ONLY: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.enabled_only }}
          OUTPUT_FILE: ${{ steps.env.outputs.output_file }}
          SOURCE_LABEL: ${{ steps.env.outputs.source_label }}
        run: node scripts/pull-iterable-journeys.js

      - name: Show output for review
        run: cat "${{ steps.env.outputs.output_file }}"

      - name: Commit updated data file
        run: |
          git config user.name "iterable-sync-bot"
          git config user.email "actions@github.com"
          git add "${{ steps.env.outputs.output_file }}"
          git diff --staged --quiet || git commit -m "Update Iterable journey data (${{ steps.env.outputs.environment }}, ${{ github.event_name == 'schedule' && 'scheduled run' || 'manual run' }})"
          git push
